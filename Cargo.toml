[workspace]
members = ["crates/core", "crates/desktop"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24", features = ["v4", "serde"] }
glam = { version = "0.33", features = ["serde"] }
e57 = { version = "0.11.13", features = ["crc32c"] }
las = { version = "0.11.1", features = ["laz-parallel"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "wgsl"] }
rfd = "0.17.2"
bytemuck = { version = "1.23", features = ["derive"] }
tempfile = "3.20"
zstd = "0.14.0"

[profile.release]
lto = "thin"

# Optimized build for smoke tests during development: skips LTO and keeps
# incremental compilation so a one-file change relinks quickly.
[profile.smoke]
inherits = "release"
lto = false
incremental = true
codegen-units = 256

# The brute-force checks in the filter tests and the ICP tests are slow
# unoptimized; opt-level 1 keeps debug assertions and overflow checks.
[profile.test]
opt-level = 1
