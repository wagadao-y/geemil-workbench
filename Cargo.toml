[workspace]
members = ["crates/core", "crates/desktop"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24", features = ["v4", "serde"] }
glam = { version = "0.31", features = ["serde"] }
e57 = "0.11.13"
las = { version = "0.9.11", features = ["laz"] }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "wgpu"] }
wgpu = { version = "24.0.5", default-features = false, features = ["dx12", "wgsl"] }
rfd = "0.15.4"
bytemuck = { version = "1.23", features = ["derive"] }
tempfile = "3.20"
zstd = "0.13.3"

[profile.release]
lto = "thin"
